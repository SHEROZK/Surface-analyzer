name: Surface Analyzer CI

on:
  push:
    branches: [main, feature/semantic-segmentation, feat/visualization-engine-rebuild]
  pull_request:
    branches: [main, feature/semantic-segmentation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surface-analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  api:
    name: API tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: surface
          POSTGRES_PASSWORD: surface_dev_password
          POSTGRES_DB: surface_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surface -d surface_analyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall -q app migrations
      - name: Run API tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://surface:surface_dev_password@localhost:5432/surface_analyzer
          PYTHONPATH: ${{ github.workspace }}/apps/api
          UPLOAD_DIR: ${{ runner.temp }}/surface-analyzer-uploads
        run: pytest -q
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://surface:surface_dev_password@localhost:5432/surface_analyzer
        run: alembic upgrade head

  deployment-config:
    name: Self-hosted deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-only-dummy-password
      AUTH_SECRET: ci-only-dummy-signing-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Validate shell scripts
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh

  powershell:
    name: Windows installer and backup script syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @("scripts/install.ps1", "scripts/backup.ps1", "scripts/restore.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($file + ": " + ($errors -join "; ")) }
          }
