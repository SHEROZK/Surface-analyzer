name: Surface Analyzer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: surface
          POSTGRES_PASSWORD: surface_dev_password
          POSTGRES_DB: surface_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surface -d surface_analyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall -q app migrations
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://surface:surface_dev_password@localhost:5432/surface_analyzer
        run: alembic upgrade head
